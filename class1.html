<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Page Basic</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .container{
            border: 5px solid black;
            height: 480px;
            width: 400px;
            margin: auto;
            text-align: center;
            /* font-weight: bold;
            font-size: 2vw; */
            padding-top: 20px;
            padding-bottom: 20px;
        }
        header{
            padding-left: 50px;
            display: inline-block;
            font-weight: bold;
            font-size: 2vw;
        }
        button{
            display: flex;
            float:right;
        }
        .inner{
            border: 1px solid black;
            border-left: none;
            border-right: none;
            margin-top: 10px;
        }
        img{
            height: 100px;
            width: 300px;
            padding: 20px;
        }
        button{
            margin: 10px;
        }
        .boxes{
            border: 1px solid black;
            background-color: antiquewhite;
            width: 300px;
            height: 180px;
            border-left: none;
            float: left;
        }
        .text{
            border: 1px solid black;
            background-color: rgb(0, 255, 21);
            width: 200px;
            height: 30px;
            margin: 20px auto;

        }
        .img{
            border: 1px solid black;
            background-color: rgb(0, 255, 89);
            width: 200px;
            width: 200px;
            height: 30px;
            margin: 20px auto;            
        }
        .video{
            border: 1px solid rgb(0, 0, 0);
            background-color: rgb(140, 255, 0);
            width: 200px;
            height: 30px;
            margin: 20px auto;
        }
        .right{
            float: right;
            border: 1px solid black;
            /* margin-left: 0px; */
            height: 180px;
            width: 96px;
        
        }
        .sec1{
            border: 1px solid black;
            margin: 10px;
        }
        .sec2{
            border: 1px solid black;
            margin: 10px;
        }
        .sec3{
            border: 1px solid black;
            margin: 10px;
        }
        .a{
            border: 2ppx solid rgb(117, 52, 52);
            background-color: rgb(95, 175, 175);
            width: 200px;
            height: 200px;
        }
        .foot{
            display: flex;
            /* align-content: center; */
            margin:20px;
            float: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <header><b><u>Portal</u></b> </header>
        <button>Sign in</button>
        <button>Log in</button>
        <div class="inner">
            <img src="https://www.sourcesplash.com/i/random?q=ocean">
        </div>
        <div class="boxes">
            <div class="text">

            </div>
            <div class="img">

            </div>
            <div class="video">

            </div>
        </div>
        <div class="right">
            <div class="sec1">
                sec a
            </div>
            <div class="sec2">
                sec b
            </div>
            <div class="sec3">
                sec c
            </div>
        </div>
        <footer class="foot">
            <button>b1</button>
            <button>b2</button>
            <button>b3</button>
            <button>b4</button>
        </footer>
    </div>

</body>
</html>
